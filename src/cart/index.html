<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Cart</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link
      rel="stylesheet"
      href="/css/style-large.css"
      media="(min-width: 1000px)"
    />
    <script src="../js/cart.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header">
      <!-- A template will be added here using JavaScript. -->
    </header>

    <main class="divider">
      <section class="products">
        <h2>My Cart</h2>
        <ul class="product-list">
          <!-- The dynamic product list will be added here. -->
        </ul>
        <p class="cart-empty">There are no products to display.</p>
        <div class="cart-footer hide">
          <!-- This will be displayed when the shopping cart contains items to show. -->
          <p class="cart-total">
            Total: <span class="cart-total__amount"></span>
          </p>
          <a class="checkout-button" href="/checkout/index.html">Checkout</a>
        </div>
      </section>
    </main>

    <footer id="main-footer">
      <!-- A template will be added here using JavaScript. -->
    </footer>
  </body>
</html>
